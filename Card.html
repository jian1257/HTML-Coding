<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Colour Card</title>
    <style>
        /* Universal Selector - applies to everything on the page */
        * {
            font-size: 16px;
        }
    
        /* Element Selectors */
        body {
            background-color: lightblue;
        }
    
        h1 {
            color: darkblue;
        }
    
        h2 {
            color: purple;
        }
    
        p {
            color: dimgray;
        }
    
        /*  Class Selector */
        .my-detail {
            color: darkgreen;
            font-weight: bold;
        }
    
        /* ID Selector */
        #my-card {
            background-color: black;
        }
    </style>
</head>
<body>
    <h1>My Colour Card </h1>
    <! -- Inline CSS: Add style="color: ____;" inside this p tag -->
    <p style="color: crimson;"> Hi This Is My Very Own Webpage.</p>
 <div id="my-card">
    <h2>About Me </h2>
    <p class="my-detail"> My Name Is Jian.</p>
    <p class="my-detail"> My Favorite Colour is Blue.</p>
    <p class="my-detail"> My Favorite Subject Is Computer.</p>
    <p class="my-detail">My Favorite Food Is Pizza.</p>
 </div>
 <h2>My Favorite Things</h2>
 <p>My Favorite Animal Is A Dog</p>
 <p>My Favorite Sport Is Cricket</p>
 <p>My Favorite Movie Is The Lion King.</p>
</body>
</html>
