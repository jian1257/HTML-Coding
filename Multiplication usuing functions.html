<!DOCTYPE html>
<html>

<head>
</head>

<body>
    <button onclick="multiply(4)">Click Me!</button>
    <p id="result"></p>
</body>

</html>

<script>
    function multiply(a, b) {
        if (b === undefined) {
            alert("The value of b is undefined");
            b = 5;
        }
        var result = a * b;

        // Moved inside the function so it runs when clicked and can access 'result'
        document.getElementById("result").innerHTML = result;
    }
</script>
