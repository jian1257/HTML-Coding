<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Superhero Card</title>
<style>
    /* Typography - font,size, weight,colour for the whole page */
    body {
        background-color: darkblue;
        color: white;
        font-family: arial, sans-serif;
    }
    /* Typography + Text Shadow - big bold title with an orange shadow */
    .hero-name {
        font-size: 60px;
        font-weight: bold;
        color: yellow;
        text-shadow: 3px 3px orange;
    }
    /* Typography + Text Transform - tagline becomes Title case */
    .tagline {
        font-style: italic;
        color: lightblue;
        text-transform: capitalize;
    }
    /* Text Transform + Text Decoration - section headings in CAPS with underline*/
    .label {
        text-transform: uppercase;
        text-decoration: underline;
        color: coral;
    }
    /* Typography - powers stand out in bold green */
    .power {
        font-weight: bold;
        color: lightgreen;
    }
    /* Text Decoration - weaknesses are crossed out */
    .weakness {
        text-decoration: line-through;
        color: gray;
    }
    /* Transform - The badge is tilted to the side */
    .badge {
        font-size: 28px;
        font-weight: bold;
        color: gold;
        transform: rotate(15deg);
    }
    /* typografhy - Footer Text */
    .made-by {
        color: coral;
        font-style: italic;
    }
</style>
</head>
<body>
<h1 class="hero-name"> Thunder Kid</h1>
<p class="tagline">The Mose powerful hero in the school</p>
<h2 class="label">Super powers</h2>
<p class="power"> Can run faster than a cheetah</p>
<p class="power"> Can lift a school bus</p>
<h2 class="label">weaknesses</h2>
<p class="weaknesses"> Maths Homework</p>
<p class="weaknesses"> broccoli</p>
<p class="badge">Top hero</p>
<p class="made-by"> Created by Jian </p>

</body>
</html>
