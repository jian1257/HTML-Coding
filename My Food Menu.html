<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Food Menu </title>
    <style>
        body {
            font-family: arial;
            background: #fff8f0;
            padding: 30px;
            text-align: center;
        }
        h1 { color: #e65c00;}
        /* Sibling Selector - styles the paragraph right after h1 */
        h1 + p {
            background: #ffe0b2;
            padding: 10px 20px;
            border-radius: 8px;
            color: #bf360c;
            display: inline-block;
        }
        u1 { padding: 0; margin-top: 20px;}
        /* Child Selector - Styles only direct li children of u1 */
        u1 > li{
            list-style: none;
            font-size: 18px;
            font-weight: bold;
            color: #5d4037;
            padding: 10px 20px;
            margin: 6px auto;
            width: 260px;
            background: #fff3e0;
            border-radius: 8px;
        }
        /* nth child - Highlights the 3rd item as Chef's Special */
        

        
    </style>
</head>
<body>
    
</body>
</html>
